name: repro

on:
  push:
  workflow_dispatch:
    inputs:
      upstream:
        description: Also run the unreduced page-leaks test (slow — builds playwright)
        type: boolean
        default: false

jobs:
  repro:
    name: ${{ matrix.os }} · pw ${{ matrix.playwright }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-15 / macos-26 are Apple Silicon. ubuntu-24.04-arm is arm64 too, but 4 KB
        # pages and not Darwin, so it separates "arm64" from "Apple Silicon macOS".
        os: [macos-15, macos-26, ubuntu-24.04-arm]
        # 1.62.0 ships WebKit r2336 (last good), 1.63.0 ships r2359 (first bad).
        playwright: ['1.62.0', '1.63.0']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm install --no-package-lock --no-save @playwright/test@${{ matrix.playwright }}
          npx playwright install --with-deps webkit

      - name: Run repro
        run: |
          set -o pipefail
          node repro.js --repeat=10 2>&1 | tee result.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }} · @playwright/test@${{ matrix.playwright }}"
            echo '```'
            cat result.txt || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Control: the unreduced test, at the exact commit where microsoft/playwright's own
  # macos-15-xlarge bot fails it. Tells us whether a green `repro` job above means
  # "this runner does not trigger it" or "the reduction lost the trigger".
  upstream-test:
    if: github.event_name == 'push' || inputs.upstream
    name: playwright page-leaks · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]

    steps:
      - uses: actions/checkout@v4
        with:
          repository: microsoft/playwright
          ref: 1cee22292e43dd6abb22b2fb560d12a9db4669c4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit

      # CI=1 is already set by Actions, so this picks up fullyParallel:false and retries:3,
      # matching how the bot runs it.
      - run: npx playwright test --config=tests/library/playwright.config.ts tests/page/page-leaks.spec.ts --project=webkit-page --reporter=line
